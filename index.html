<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <title>Classroom | Learning workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview" aria-label="Classroom home">
        <span class="brand-mark">c</span>
        <span>classroom<span class="brand-period">.</span></span>
      </a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <label class="role-switch-label" for="role-switch">Viewing as</label>
      <select id="role-switch" class="role-switch" aria-label="Switch demo role">
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
        <option value="admin">Administrator</option>
      </select>
      <nav id="navigation" class="nav-list"></nav>
      <div class="sidebar-bottom">
        <div class="help-note"><span class="help-mark">?</span><span><strong>Need a hand?</strong><small>Visit the help center</small></span></div>
        <button class="profile-button" id="profile-button" type="button" aria-label="Current profile">
          <span class="avatar avatar-plum">AM</span><span class="profile-copy"><strong id="profile-name">Alex Morgan</strong><small id="profile-role">Teacher account</small></span><span class="profile-more">···</span>
        </button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-name">Overview</strong></div>
        <div class="top-actions">
          <select id="mobile-role-switch" class="mobile-role-switch" aria-label="Switch demo role">
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
          </select>
          <label class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search anything"><kbd>⌘ K</kbd></label>
          <button class="icon-button notification-trigger" type="button" data-view="Notifications" aria-label="Open notifications"><span aria-hidden="true">♧</span><i id="notification-dot"></i></button>
          <span class="top-divider"></span>
          <span class="today-label" id="today-label"></span>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
    <form id="dialog-form" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow" id="dialog-eyebrow">NEW ITEM</p><h2 id="dialog-title">Create a class</h2></div><button class="dialog-close" type="button" aria-label="Close dialog" data-close-dialog>×</button></div>
      <div class="dialog-fields" id="dialog-fields"></div>
      <div class="dialog-footer"><button class="button button-quiet" type="button" data-close-dialog>Cancel</button><button class="button button-primary" type="submit" id="dialog-submit">Save changes <span aria-hidden="true">→</span></button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
